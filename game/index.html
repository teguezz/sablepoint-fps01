<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SABLEPOINT — Rustfall Yard</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #14100c; }
  #game, #game canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; font-family: "Segoe UI", system-ui, sans-serif; color: #f2ede4; user-select: none; }
  #hud button { pointer-events: auto; }

  /* Crosshair */
  .sp-cross { position: absolute; left: 50%; top: 50%; --sp: 6px; }
  .sp-cross div { position: absolute; background: rgba(255,255,255,0.9); box-shadow: 0 0 2px #000; }
  .sp-cross-t { left: -1px; top: calc(-1 * var(--sp) - 9px); width: 2px; height: 9px; }
  .sp-cross-b { left: -1px; top: var(--sp); width: 2px; height: 9px; }
  .sp-cross-l { top: -1px; left: calc(-1 * var(--sp) - 9px); width: 9px; height: 2px; }
  .sp-cross-r { top: -1px; left: var(--sp); width: 9px; height: 2px; }
  .sp-cross-dot { left: -1.5px; top: -1.5px; width: 3px; height: 3px; border-radius: 50%; }

  /* Hitmarker */
  .sp-hit { position: absolute; left: 50%; top: 50%; width: 0; height: 0; opacity: 0; }
  .sp-hit div { position: absolute; width: 2px; height: 10px; background: #fff; }
  .sp-hit-a { transform: translate(-9px, -11px) rotate(45deg); }
  .sp-hit-b { transform: translate(7px, -11px) rotate(-45deg); }
  .sp-hit-c { transform: translate(-9px, 1px) rotate(-45deg); }
  .sp-hit-d { transform: translate(7px, 1px) rotate(45deg); }
  .sp-hit.sp-show { opacity: 1; }
  .sp-hit.sp-kill div { background: #ff4d2e; height: 13px; }

  /* Top bar */
  .sp-top { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); text-align: center; }
  .sp-timer { font-size: 30px; font-weight: 700; letter-spacing: 2px; text-shadow: 0 2px 4px #000; }
  .sp-phase { font-size: 11px; letter-spacing: 3px; color: #e8a33d; }
  .sp-score { font-size: 20px; font-weight: 700; margin-top: 2px; text-shadow: 0 2px 4px #000; }
  .sp-round { font-size: 11px; letter-spacing: 2px; color: #cfc8bb; }

  /* Kill feed */
  .sp-feed { position: absolute; top: 12px; left: 14px; font-size: 13px; line-height: 1.7; }
  .sp-feed-row { background: rgba(0,0,0,0.45); padding: 1px 8px; margin-bottom: 3px; border-radius: 3px; }
  .sp-feed-v { color: #e8a33d; font-weight: 700; }
  .sp-feed-w { color: #5b9bd5; font-weight: 700; }
  .sp-feed-wpn { color: #cfc8bb; }

  /* Minimap */
  .sp-map { position: absolute; top: 12px; right: 14px; border: 2px solid rgba(255,255,255,0.25); border-radius: 4px; background: rgba(0,0,0,0.5); }

  /* Bottom left: health */
  .sp-bl { position: absolute; left: 18px; bottom: 16px; }
  .sp-hp { font-size: 44px; font-weight: 800; line-height: 1; text-shadow: 0 2px 5px #000; }
  .sp-hp.sp-low { color: #ff5a3c; }
  .sp-hp-label { font-size: 11px; letter-spacing: 3px; color: #cfc8bb; }
  .sp-arm { font-size: 14px; color: #7fb8e8; margin-top: 2px; font-weight: 600; }

  /* Bottom right: ammo / money */
  .sp-br { position: absolute; right: 18px; bottom: 16px; text-align: right; }
  .sp-ammo { font-size: 34px; font-weight: 800; line-height: 1; text-shadow: 0 2px 5px #000; }
  .sp-ammo.sp-low { color: #ff5a3c; }
  .sp-wname { font-size: 13px; color: #cfc8bb; letter-spacing: 1px; }
  .sp-money { font-size: 22px; font-weight: 700; color: #7fd07f; margin-top: 4px; text-shadow: 0 2px 4px #000; }
  .sp-nades { font-size: 12px; color: #cfc8bb; margin-top: 2px; letter-spacing: 1px; }

  /* Centre banner */
  .sp-banner { position: absolute; left: 50%; top: 26%; transform: translateX(-50%); text-align: center; opacity: 0; transition: opacity 0.25s; }
  .sp-banner.sp-show { opacity: 1; }
  .sp-banner-title { font-size: 42px; font-weight: 800; letter-spacing: 4px; text-shadow: 0 3px 8px #000; }
  .sp-banner-sub { font-size: 15px; color: #e8d9b8; text-shadow: 0 2px 4px #000; }

  /* Objective progress bar */
  .sp-obj { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); width: 260px; text-align: center; }
  .sp-obj-label { font-size: 13px; letter-spacing: 2px; margin-bottom: 5px; text-shadow: 0 2px 4px #000; }
  .sp-obj-fill { height: 8px; background: #e8a33d; width: 0%; border-radius: 4px; transition: width 0.1s linear; }

  /* Damage vignette + flash */
  .sp-vignette { position: absolute; inset: 0; opacity: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(255,30,10,0.55) 100%); transition: opacity 0.3s; }
  .sp-vignette.sp-show { opacity: 1; }
  .sp-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.15s; }

  /* Buy menu */
  .sp-buy { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 320px;
    background: rgba(10,9,7,0.88); border: 1px solid #5a4a33; border-radius: 6px; padding: 12px 14px; pointer-events: auto; }
  .sp-buy-title { font-size: 14px; font-weight: 700; letter-spacing: 2px; color: #e8a33d; margin-bottom: 8px; }
  .sp-buy-row { display: flex; gap: 8px; padding: 5px 6px; border-radius: 3px; cursor: pointer; font-size: 14px; }
  .sp-buy-row:hover { background: rgba(232,163,61,0.18); }
  .sp-buy-row.sp-cant { opacity: 0.45; }
  .sp-buy-key { display: inline-block; min-width: 20px; font-weight: 700; color: #e8a33d; }
  .sp-buy-name { flex: 1; }
  .sp-buy-price { color: #7fd07f; font-weight: 600; }

  /* Start + end overlays */
  .sp-start, .sp-end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(180deg, rgba(20,12,6,0.82), rgba(20,12,6,0.94)); pointer-events: auto; text-align: center; }
  .sp-start-title { font-size: 64px; font-weight: 900; letter-spacing: 10px; color: #e8a33d; text-shadow: 0 4px 18px #000; }
  .sp-start-sub { font-size: 16px; color: #e8d9b8; margin-top: 6px; letter-spacing: 1px; }
  .sp-start-keys { font-size: 13px; color: #b8b0a2; margin-top: 22px; }
  .sp-start-btn { margin-top: 28px; font-size: 20px; font-weight: 800; letter-spacing: 2px; padding: 14px 34px;
    background: #e8a33d; color: #1c1206; border: none; border-radius: 6px; cursor: pointer; }
  .sp-start-btn:hover { background: #f2b452; }
  .sp-end-title { font-size: 72px; font-weight: 900; letter-spacing: 8px; text-shadow: 0 4px 18px #000; }
  .sp-end-sub { font-size: 18px; color: #e8d9b8; margin-top: 10px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js"
  }
}
</script>
</head>
<body>
<div id="game"></div>
<div id="hud"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
